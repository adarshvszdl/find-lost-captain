<style>
/* Layout: the full-screen sunlit archipelago IS the game; everything else floats over it as chunky game HUD —
   a top status bar, a bottom challenge card, a ship's-log dialog box, and full-screen cinematic moments.
   One committed daylight look by design (no dark variant): every colour is set explicitly. */
:root {
  color-scheme: light;
  --navy: #1f2d4d;      /* ink + every outline */
  --navy-2: #2f4170;
  --cream: #fff8e7;     /* card body */
  --sun: #ffc93c;       /* primary actions, highlights */
  --sun-dk: #e8920c;
  --coral: #ff6b4a;     /* ribbons, penalties */
  --coral-dk: #c9432a;
  --leaf: #3fbf6a;      /* success, go */
  --leaf-dk: #23864a;
  --lagoon: #5fe0d4;
  --deep: #196aa9;      /* open sea, page ground */
  --muted: #5d6b86;
  --white: #ffffff;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --outline: 3px 0 0 var(--navy), -3px 0 0 var(--navy), 0 3px 0 var(--navy), 0 -3px 0 var(--navy), 2px 2px 0 var(--navy), -2px 2px 0 var(--navy), 2px -2px 0 var(--navy), -2px -2px 0 var(--navy);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--deep); color: var(--navy); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-bottom, 0px)); }
#ui button, #ui input, #ui summary, #ui details, #ui .card, #ui .dlg, #ui .chip, #ui .pips, #ui .overlay, #ui form { pointer-events: auto; }
.screen { height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.grow { flex: 1 1 0; min-height: 0; }
.dock { flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

.muted { color: var(--muted); }
.small { font-size: .9rem; }
.strong { font-weight: 800; }
.err { color: var(--coral-dk); font-weight: 800; }
.msg { font-weight: 700; color: var(--muted); }
.msg.err { color: var(--coral-dk); }

/* Logo */
.logo { display: grid; justify-items: center; text-align: center; gap: 2px; pointer-events: none; }
.logo-kicker { font-family: var(--f-display); font-size: clamp(1.1rem, 4.6vw, 1.7rem); color: var(--sun); text-shadow: var(--outline), 0 5px 0 var(--navy); }
.logo-main { font-family: var(--f-display); font-size: clamp(2.2rem, 9.6vw, 5.2rem); line-height: .95; text-wrap: balance; max-width: 100%; color: var(--white); transform: rotate(-2deg);
  text-shadow: 4px 0 0 var(--navy), -4px 0 0 var(--navy), 0 4px 0 var(--navy), 0 -4px 0 var(--navy), 3px 3px 0 var(--navy), -3px 3px 0 var(--navy), 3px -3px 0 var(--navy), -3px -3px 0 var(--navy), 0 10px 0 var(--navy), 0 16px 22px rgba(0,0,0,.35); }
.logo-sub { margin-top: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .24em; font-size: .8rem; color: var(--white); background: var(--coral); border: 3px solid var(--navy); border-radius: 999px; padding: 4px 16px; box-shadow: 0 4px 0 var(--navy); }

.logo.sm .logo-kicker { font-size: .95rem; text-shadow: var(--outline); }

.sheet-wrap.wide { width: min(780px, 100%); }
.sheet-wrap.side { width: 100%; }
.sheet { overflow: auto; min-height: 0; display: grid; gap: 14px; padding-top: 34px; }
.ribbon { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--coral); color: var(--white); font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .02em; padding: 7px 24px 9px;
  border: 4px solid var(--navy); border-radius: 14px; text-shadow: 0 2px 0 var(--coral-dk); box-shadow: 0 5px 0 rgba(31,45,77,.4); }
.ribbon.green { background: var(--leaf); text-shadow: 0 2px 0 var(--leaf-dk); }

.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sub { font-weight: 900; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; font-weight: 600; }
.intro-foot { display: flex; align-items: center; justify-content: center; gap: 14px; }
.intro-num { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; min-width: 1.6em; text-align: center; color: var(--coral); }
.enter { animation: popIn .45s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes popIn { from { opacity: 0; transform: translateY(30px) scale(.94); } }

/* Buttons */
.gbtn { font-family: var(--f-display); font-size: 1.2rem; letter-spacing: .02em; color: var(--navy); background: linear-gradient(#ffdb6e, var(--sun)); border: 3px solid var(--navy); border-radius: 16px;
  padding: 11px 22px 12px; box-shadow: 0 6px 0 var(--navy); transition: transform .08s, box-shadow .08s, filter .15s; }
.gbtn:hover:not(:disabled) { filter: brightness(1.06); }
.gbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy); }
.gbtn:disabled { opacity: .5; cursor: not-allowed; }
.gbtn.green { background: linear-gradient(#72df8f, var(--leaf)); color: var(--white); text-shadow: 0 2px 0 var(--leaf-dk); }
.gbtn.coral { background: linear-gradient(#ff9277, var(--coral)); color: var(--white); text-shadow: 0 2px 0 var(--coral-dk); }
.gbtn.plain { background: var(--cream); }
.gbtn.big { font-size: 1.45rem; padding: 14px 30px 15px; }
.gbtn.small { font-size: 1rem; padding: 7px 14px 8px; box-shadow: 0 4px 0 var(--navy); }
.field { font: inherit; font-size: 1.2rem; font-weight: 800; width: 100%; padding: 12px 16px; border: 3px solid var(--navy); border-radius: 14px; background: var(--white); color: var(--navy); }

/* HUD */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(31,45,77,.92); color: var(--white); border: 3px solid var(--white); border-radius: 999px;
  padding: 4px 14px 4px 5px; font-weight: 800; font-size: .95rem; box-shadow: 0 4px 0 rgba(31,45,77,.35); max-width: 100%; }
.chip .dot { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--sun); color: var(--navy); display: grid; place-items: center; font-family: var(--f-display); font-size: .95rem; border: 2px solid var(--navy); }
.chip.live .dot { animation: pulse 1.2s ease-in-out infinite; }
.chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12ch; }
.chip.bump { animation: bump .5s cubic-bezier(.2, 2, .4, 1); }
@keyframes bump { 40% { transform: scale(1.18); } }
@keyframes pulse { 50% { transform: scale(.8); opacity: .6; } }
.mini-portrait { width: 26px; height: 26px; flex: none; border-radius: 6px; border: 2px solid var(--navy); background-color: var(--sun);
  background-image: linear-gradient(90deg, transparent 30%, var(--navy) 30% 38%, transparent 38% 62%, var(--navy) 62% 70%, transparent 70%), linear-gradient(transparent 30%, var(--navy) 30% 38%, transparent 38% 62%, var(--navy) 62% 70%, transparent 70%); }
.pips { display: flex; align-items: center; background: rgba(31,45,77,.92); border: 3px solid var(--white); border-radius: 999px; padding: 4px 10px; box-shadow: 0 4px 0 rgba(31,45,77,.35); }
.pip { position: relative; width: 26px; height: 26px; border-radius: 50%; background: #4a5a80; color: #c8d3ea; display: grid; place-items: center; font-family: var(--f-display); font-size: .9rem; border: 2px solid #ffffff44; }
.pip + .pip { margin-left: 12px; }
.pip + .pip::before { content: ""; position: absolute; right: calc(100% + 2px); top: 50%; width: 12px; height: 3px; margin-top: -1.5px; background: #ffffff55; }
.pip.done { background: var(--leaf); color: var(--white); border-color: var(--white); }
.pip.now { background: var(--sun); color: var(--navy); border-color: var(--white); box-shadow: 0 0 0 4px rgba(255,201,60,.4); }
.back-host { align-self: flex-end; }

/* Ship's log dialog */
.dlg { position: relative; width: min(680px, 100%); background: rgba(31,45,77,.94); color: var(--white); border: 4px solid var(--white); border-radius: 20px; padding: 26px 20px 18px;
  display: grid; gap: 10px; box-shadow: 0 8px 0 rgba(31,45,77,.35), 0 20px 40px rgba(0,0,0,.3); margin-top: 20px; }
.dlg-name { position: absolute; top: -18px; left: 18px; background: var(--sun); color: var(--navy); font-family: var(--f-display); font-size: 1.05rem; border: 3px solid var(--navy); border-radius: 10px; padding: 2px 12px 4px; }
.dlg-text { font-size: 1.08rem; font-weight: 700; line-height: 1.5; }
.dlg-stat { font-family: var(--f-display); font-size: 1.35rem; color: var(--sun); }
.dlg .chip { justify-self: start; background: var(--navy-2); }
.dlg .err { color: #ffb3a1; }

/* Timer */
.timer-wrap { position: relative; flex: none; }
.timer-pill { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.1; background: linear-gradient(#ffdb6e, var(--sun)); border: 3px solid var(--navy); border-radius: 14px; padding: 2px 14px 4px;
  box-shadow: 0 4px 0 var(--navy); min-width: 6.4ch; text-align: center; font-variant-numeric: tabular-nums; }
.pen { position: absolute; right: 4px; top: 100%; font-family: var(--f-display); font-size: 1.3rem; color: var(--coral); text-shadow: var(--outline); pointer-events: none; opacity: 0; }
.pen.float { animation: floatUp 1.1s ease-out; }
@keyframes floatUp { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
</style>
<style>
/* Challenges */
.game { display: grid; gap: 14px; }
.scroll-q { background: var(--white); border: 3px solid var(--navy); border-radius: 18px; padding: 14px 18px 16px; display: grid; gap: 6px; box-shadow: 0 5px 0 rgba(31,45,77,.25); }
.scroll-q .q { font-family: var(--f-display); font-size: clamp(1.2rem, 4.6vw, 1.55rem); line-height: 1.25; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--white); border: 3px solid var(--navy); border-radius: 16px; padding: 11px 14px; box-shadow: 0 5px 0 var(--navy);
  font-weight: 800; font-size: 1.08rem; color: var(--navy); transition: transform .08s, box-shadow .08s; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
.opt .letter { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--sun); border: 3px solid var(--navy); display: grid; place-items: center; font-family: var(--f-display); }
.opt.wrong { background: #ffe3da; border-color: var(--coral-dk); text-decoration: line-through; cursor: not-allowed; box-shadow: 0 5px 0 var(--coral-dk); }
.opt.wrong .letter { background: var(--coral); color: var(--white); }
.bottle-msg { font-family: var(--f-display); font-size: clamp(1.8rem, 8vw, 2.7rem); letter-spacing: .22em; text-align: center; color: var(--deep); background: #e6f6fb; border: 3px solid var(--navy); border-radius: 16px; padding: 8px 4px 10px; }
.slots, .tiles { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.slot { width: clamp(32px, 9.5vw, 48px); height: clamp(42px, 11vw, 54px); border: 3px dashed #b3c3d8; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; background: rgba(255,255,255,.6); }
.slot.full { border-style: solid; border-color: var(--navy); background: var(--white); }
.tile { width: clamp(34px, 10vw, 50px); height: clamp(40px, 11vw, 54px); border-radius: 10px; border: 3px solid var(--navy); background: linear-gradient(#ffeab5, #f2c86f); color: var(--navy); font-family: var(--f-display); font-size: 1.5rem; box-shadow: 0 5px 0 var(--navy); }
.tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
.tile:disabled { opacity: .2; cursor: default; }
.lid { background: linear-gradient(#a8693a, #7a4a26); border: 3px solid var(--navy); border-radius: 16px; padding: 12px 14px; color: var(--cream); box-shadow: inset 0 0 0 3px #c98a4f, 0 5px 0 rgba(31,45,77,.3); display: grid; gap: 8px; }
.lid .label { color: var(--sun); }
.table-wrap { overflow-x: auto; }
.clues { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.clues td { vertical-align: middle; font-weight: 800; }
.clues td:first-child { width: 1%; padding-right: 12px; }
.code { display: inline-flex; gap: 3px; }
.code span { width: 28px; height: 34px; display: grid; place-items: center; background: var(--navy); color: var(--white); font-family: var(--f-display); font-size: 1.25rem; border-radius: 6px; }
.lockopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 12px; padding-top: 20px; }
.lockopt { position: relative; display: grid; justify-items: center; padding: 14px 8px 12px; background: linear-gradient(#ffdb6e, var(--sun)); border: 3px solid var(--navy); border-radius: 16px; box-shadow: 0 5px 0 var(--navy); }
.lockopt::before { content: ""; position: absolute; bottom: calc(100% + 3px); left: 50%; width: 46px; height: 26px; margin-left: -23px; border: 6px solid #8d99ad; border-bottom: 0; border-radius: 24px 24px 0 0; }
.lockopt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--navy); }
.lockopt:disabled { filter: grayscale(1); opacity: .45; cursor: not-allowed; }
.wheels { display: flex; gap: 4px; }
.wheels span { width: 32px; height: 42px; border-radius: 7px; background: linear-gradient(var(--navy-2), var(--navy) 50%, var(--navy-2)); color: var(--white); font-family: var(--f-display); font-size: 1.5rem; display: grid; place-items: center; border: 2px solid var(--navy); }
.hold { display: block; width: min(100%, calc((100vh - 350px) * 4 / 3)); width: min(100%, calc((100dvh - 350px) * 4 / 3)); min-width: min(100%, 240px); margin: 0 auto; max-width: 100%; aspect-ratio: 4 / 3; border: 3px solid var(--navy); border-radius: 14px; background: #000; touch-action: none; cursor: none; user-select: none; -webkit-user-select: none; }
.pill { display: inline-flex; align-items: center; padding: 3px 12px; border: 3px solid var(--navy); border-radius: 999px; background: var(--white); font-weight: 900; font-size: .9rem; }

/* Jigsaw */
.jig { position: relative; width: min(100%, 56vh); min-width: 240px; max-width: 100%; margin: 0 auto; aspect-ratio: 100 / 164; background: linear-gradient(#e6f6fb, #c7e6f1); border: 3px solid var(--navy); border-radius: 16px; overflow: hidden; user-select: none; -webkit-user-select: none; }
.jig-board { position: absolute; left: 14%; top: 1.2195%; width: 72%; aspect-ratio: 1; background: var(--white); box-shadow: 0 0 0 3px var(--navy), 0 0 0 8px #b9773f, 0 0 0 11px var(--navy); }
.jig-board svg { display: block; width: 100%; height: 100%; }
.jig-tray { position: absolute; left: 0; right: 0; top: 48%; text-align: center; font-weight: 900; font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.jp { position: absolute; pointer-events: none; touch-action: none; filter: drop-shadow(0 4px 3px rgba(31,45,77,.45)); }
.jp svg { display: block; width: 100%; height: auto; overflow: visible; pointer-events: none; touch-action: none; }
.jp .hit { cursor: grab; }

.portrait { width: 100%; max-width: 300px; margin: 0 auto; padding: 10px; background: linear-gradient(135deg, #c98a4f, #8a5a32); border: 4px solid var(--navy); border-radius: 16px; box-shadow: inset 0 0 0 3px var(--sun), 0 6px 0 rgba(31,45,77,.35); }
.portrait svg { display: block; width: 100%; height: auto; background: #eaf6fa; border-radius: 4px; }
.portrait .fresh path { animation: fresh 1.2s ease-out 2; }
@keyframes fresh { 35% { stroke: var(--white); stroke-width: 10px; } }

/* Cinematics */
.overlay { position: fixed; inset: 0; z-index: 5; display: grid; align-content: center; justify-items: center; gap: 16px; text-align: center; overflow: hidden;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(circle at 50% 45%, rgba(31,45,77,.5), rgba(14,22,42,.9)); animation: fadeIn .35s both; color: var(--white); }
.overlay.out { opacity: 0; transition: opacity .5s; }
@keyframes fadeIn { from { opacity: 0; } }
.rays { position: absolute; left: 50%; top: 44%; width: 1000px; height: 1000px; margin: -500px 0 0 -500px; pointer-events: none;
  background: repeating-conic-gradient(rgba(255,214,102,.32) 0 8deg, transparent 8deg 22deg);
  -webkit-mask-image: radial-gradient(closest-side, #000 12%, transparent 72%); mask-image: radial-gradient(closest-side, #000 12%, transparent 72%);
  opacity: 0; transform: scale(.4); transition: opacity .5s, transform .9s; }
.treasure.open .rays, .rays.on { opacity: 1; transform: scale(1); animation: spin 16s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }
.big-word { font-family: var(--f-display); font-size: clamp(2.2rem, 9vw, 4rem); line-height: 1; color: var(--white); text-shadow: var(--outline), 0 8px 0 var(--navy); }
.big-word.sun { color: var(--sun); }
.toast-big { position: fixed; left: 50%; top: 36%; z-index: 4; transform: translate(-50%, -50%); text-align: center; display: grid; gap: 8px; pointer-events: none; width: max-content; max-width: 92vw; animation: banner .55s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes banner { from { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-6deg); } }
.toast-big .tb-sub { font-family: var(--f-display); font-size: 1.6rem; color: var(--sun); text-shadow: var(--outline); }
.tr-box { display: grid; place-items: center; width: min(330px, 82vw); }
.tr-box > * { grid-area: 1 / 1; }
.tr-stage { position: relative; width: 100%; aspect-ratio: 1.15; transform: translateY(-110vh); }

.treasure.loot .tr-piece { animation: lootOut .7s cubic-bezier(.2, 1.5, .4, 1) forwards; animation-delay: calc(var(--i) * .15s); }
